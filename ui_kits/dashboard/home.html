<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPop — Run untrusted and agent code in microVMs</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-sans)}
a{color:var(--accent-text);text-decoration:none}
a:hover{color:var(--accent-hover);text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface-canvas) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-subtle)}
.topbar .wrap{display:flex;align-items:center;gap:24px;height:60px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 var(--font-sans);flex-shrink:0}
.wordmark{display:flex;align-items:center;gap:9px;font:600 15px/20px var(--font-sans);color:var(--text-primary)}
.navlinks{display:flex;gap:20px;flex:1}
.navlinks a{font:400 13.5px/20px var(--font-sans);color:var(--text-secondary)}
.navlinks a:hover{color:var(--text-primary);text-decoration:none}
.hero{padding:88px 0 64px;text-align:center}
.hero h1{margin:18px 0 0;font:600 52px/58px var(--font-sans);letter-spacing:-0.025em;text-wrap:balance}
.hero p{margin:18px auto 0;max-width:640px;font:16px/26px var(--font-sans);color:var(--text-secondary);text-wrap:pretty}
.ctas{display:flex;gap:12px;justify-content:center;margin-top:28px}
.termcard{max-width:680px;margin:44px auto 0;background:var(--code-bg);color:var(--code-fg);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);text-align:left;overflow:hidden}
.termcard .th{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.termcard .th span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14)}
.termcard pre{margin:0;padding:18px 20px;font:13px/22px var(--font-mono);overflow-x:auto}
.termcard .c{color:#8f8b83}.termcard .g{color:#9fce8f}.termcard .b{color:#8ab4f8}
.sect{padding:72px 0;border-top:1px solid var(--border-subtle)}
.sect h2{margin:0;font:600 30px/38px var(--font-sans);letter-spacing:-0.02em}
.sect .lead{margin:10px 0 0;max-width:620px;font:14.5px/23px var(--font-sans);color:var(--text-secondary);text-wrap:pretty}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}
.fcard{background:var(--surface-1);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:18px}
.fcard .fi{width:34px;height:34px;border-radius:var(--radius-md);background:var(--accent-subtle-bg);border:1px solid var(--accent-subtle-border);color:var(--accent-subtle-text);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.fcard .ft{font:600 14.5px/20px var(--font-sans)}
.fcard .fd{margin-top:5px;font:13px/19px var(--font-sans);color:var(--text-secondary);text-wrap:pretty}
.oss{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;margin-top:8px}
.oss ul{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.oss li{display:flex;gap:10px;font:13.5px/20px var(--font-sans);color:var(--text-secondary)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:36px}
.pcard{background:var(--surface-1);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:20px;display:flex;flex-direction:column}
.pcard.hi{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-sm)}
.pcard .pn{font:600 14px/20px var(--font-sans);display:flex;align-items:center;gap:8px}
.pcard .pp{margin-top:10px;font:600 26px/32px var(--font-sans)}
.pcard .pp em{font:400 12.5px/16px var(--font-sans);color:var(--text-tertiary);font-style:normal}
.pcard ul{margin:14px 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard li{display:flex;gap:8px;font:12.5px/18px var(--font-sans);color:var(--text-secondary)}
.foot{border-top:1px solid var(--border-subtle);padding:28px 0 40px}
.foot .wrap{display:flex;align-items:center;gap:20px}
.foot span,.foot a{font:12.5px/18px var(--font-sans);color:var(--text-tertiary)}
@media (max-width:900px){.fgrid,.pgrid{grid-template-columns:1fr 1fr}.oss{grid-template-columns:1fr}.hero h1{font-size:38px;line-height:44px}}

<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Icon, Badge } = window.AgentPopDesignSystem_47afa4;
const goAuth = (mode) => { location.href = "auth.html" + (mode ? "?mode=" + mode : ""); };
const FEATURES = [
  { i: "box", t: "Firecracker microVMs", d: "Every sandbox is a jailed microVM with its own kernel, cgroups, and nftables chain — not a container." },
  { i: "zap", t: "Ready in under 2 s", d: "Cached create-to-ready p95 below 2 seconds; exec first byte under 300 ms once running." },
  { i: "bot", t: "Cloud agents", d: "Deploy long-running agents as declarative profiles over managed sandboxes, OpenClaw-compatible out of the box." },
  { i: "plug", t: "Connector broker", d: "Agents get scoped, audited access to GitHub, Slack, Gmail, and Drive — OAuth tokens never enter the VM." },
  { i: "network", t: "Networks, storage, previews", d: "Private WireGuard networks, encrypted S3-compatible volumes, and public HTTPS preview URLs per port." },
  { i: "scroll-text", t: "Audit everything", d: "Every create, exec, and connector call lands in the audit log with HMAC-signed webhooks." },
];
const TIERS = [
  { n: "Free", p: "$0", e: "to try it", items: ["Limited monthly credits", "One project", "Community support"], cta: "Start free", v: "secondary", mode: "signup" },
  { n: "Developer", p: "$20", e: "/mo + metered usage", hi: true, items: ["Metered compute, storage, egress", "Prepaid credits", "Public preview URLs", "Email support"], cta: "Get started", v: "primary", mode: "signup" },
  { n: "Team", p: "$99", e: "/mo + metered usage", items: ["Organizations and roles", "Higher quotas", "Private previews", "Longer audit retention", "Maintained connectors"], cta: "Start a team", v: "secondary", mode: "signup" },
  { n: "Enterprise", p: "Custom", e: "annual contract", items: ["SSO/SCIM", "BYOC / VPC deployment", "Dedicated capacity", "Policy controls and SLA"], cta: "Contact sales", v: "outline", mode: "signup" },
];
function Home() {
  return (
    <React.Fragment>
      <header className="topbar">
        <div className="wrap">
          <a href="#top" className="wordmark" style={{ textDecoration: "none" }}><span className="mark">P</span>AgentPop</a>
          <nav className="navlinks">
            <a href="#features">Features</a>
            <a href="#opensource">Open source</a>
            <a href="#pricing">Pricing</a>
            <a href="docs.html">Docs</a>
          </nav>
          <Button variant="ghost" size="sm" leadingIcon={<Icon name="github" />} onClick={() => goAuth("signup")}>GitHub</Button>
          <Button variant="secondary" size="sm" onClick={() => goAuth("signin")}>Sign in</Button>
          <Button size="sm" onClick={() => goAuth("signup")}>Get started</Button>
        </div>
      </header>
      <main id="top">
        <section className="hero wrap">
          <Badge tone="accent" icon={<Icon name="sparkles" size={12} />}>Public alpha · us-east</Badge>

          <p>An open-source execution platform: Firecracker sandboxes with private networks, persistent storage, preview URLs, and a connector broker that never hands your OAuth tokens to an agent.</p>
          <div className="ctas">
            <Button size="lg" leadingIcon={<Icon name="box" />} onClick={() => goAuth("signup")}>Create a sandbox</Button>
            <Button size="lg" variant="secondary" leadingIcon={<Icon name="terminal" />} onClick={() => { location.hash = "opensource"; }}>Self-host it</Button>
          </div>
          <div className="termcard">
            <div className="th"><span></span><span></span><span></span></div>
            <pre>{"$ "}<span className="g">agentpop</span> sandbox create --image devbox:1 --size s-1vcpu-2gb{"\n"}<span className="c">sb-01ky47z9f7  provisioning → running   1.78 s</span>{"\n"}{"$ "}<span className="g">agentpop</span> exec sb-01ky47z9f7 -- python3 untrusted.py{"\n"}<span className="c"># runs jailed: own kernel, default-deny egress, full audit trail</span>{"\n"}{"$ "}<span className="g">agentpop</span> ports expose sb-01ky47z9f7 8080{"\n"}<span className="b">https://sb-01ky47z9f7-8080.preview.agentpop.cloud</span></pre>
          </div>
        </section>
        <section className="sect" id="features">
          <div className="wrap">
            <h2>Isolation first, everything else attached</h2>
            <p className="lead">The platform runs one Firecracker process per tenant behind a jailer, with host-side network policy — because agents will run code you didn't review.</p>
            <div className="fgrid">
              {FEATURES.map((f) => (
                <div className="fcard" key={f.t}>
                  <span className="fi"><Icon name={f.i} size={17} /></span>
                  <div className="ft">{f.t}</div>
                  <div className="fd">{f.d}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
        <section className="sect" id="opensource">
          <div className="wrap oss">
            <div>
              <h2>Open core, honestly drawn</h2>
              <p className="lead">The runtime, dashboard, CLI, SDKs, templates, and connector spec are Apache-2.0. You pay us to operate it — or run the same core yourself.</p>
              <ul>
                <li><Icon name="check" size={16} style={{ color: "var(--success-fg)", flexShrink: 0, marginTop: 2 }} />API, scheduler, host agent, and Firecracker lifecycle in the community repo</li>
                <li><Icon name="check" size={16} style={{ color: "var(--success-fg)", flexShrink: 0, marginTop: 2 }} />Docker Compose, Helm, and Terraform reference deployments</li>
                <li><Icon name="check" size={16} style={{ color: "var(--success-fg)", flexShrink: 0, marginTop: 2 }} />TypeScript and Python SDKs (MIT) generated from OpenAPI 3.1</li>
                <li><Icon name="check" size={16} style={{ color: "var(--success-fg)", flexShrink: 0, marginTop: 2 }} />Hosted cloud adds billing, maintained connectors, SLAs, enterprise controls</li>
              </ul>
              <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
                <Button variant="secondary" leadingIcon={<Icon name="github" />} onClick={() => goAuth("signup")}>Star on GitHub</Button>
                <Button variant="ghost" leadingIcon={<Icon name="book-open" />} onClick={() => { location.href = "docs.html"; }}>Read the docs</Button>
              </div>
            </div>
            <div className="termcard" style={{ margin: 0 }}>
              <div className="th"><span></span><span></span><span></span></div>
              <pre><span className="c"># single-host community deployment</span>{"\n"}{"$ "}git clone github.com/reddywritescode/agentpop{"\n"}{"$ "}docker compose up -d{"\n"}<span className="c"># control plane on :8080 · point one Ubuntu KVM host at it</span>{"\n"}{"$ "}<span className="g">agentpop</span> host install --gateway https://localhost:8080</pre>
            </div>
          </div>
        </section>
        <section className="sect" id="pricing">
          <div className="wrap">
            <h2>Pricing that follows usage</h2>
            <p className="lead">Metered vCPU-seconds, GiB-seconds of memory, disk GiB-hours, snapshot GiB-months, and egress. Idle pause and TTL defaults keep it predictable.</p>
            <div className="pgrid">
              {TIERS.map((t) => (
                <div className={"pcard" + (t.hi ? " hi" : "")} key={t.n}>
                  <div className="pn">{t.n}{t.hi ? <Badge tone="accent" size="sm">popular</Badge> : null}</div>
                  <div className="pp">{t.p} <em>{t.e}</em></div>
                  <ul>{t.items.map((x) => <li key={x}><Icon name="check" size={14} style={{ color: "var(--success-fg)", flexShrink: 0, marginTop: 2 }} />{x}</li>)}</ul>
                  <Button variant={t.v} style={{ width: "100%" }} onClick={() => goAuth(t.mode)}>{t.cta}</Button>
                </div>
              ))}
            </div>
          </div>
        </section>
      </main>
      <footer className="foot">
        <div className="wrap">
          <span className="wordmark" style={{ font: "600 13px/18px var(--font-sans)" }}><span className="mark" style={{ width: 20, height: 20, fontSize: 10 }}>A</span>AgentPop</span>
          <span>Apache-2.0 core · © 2026</span>
          <span style={{ flex: 1 }}></span>
          <a href="#features">Features</a>
          <a href="#pricing">Pricing</a>
          <a href="auth.html?mode=signin">Sign in</a>
          <a href="index.html">Dashboard</a>
        </div>
      </footer>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Home />);
</script>
