<!-- @dsCard group="Colors" viewport="700x130" name="Borders" subtitle="Three hairline steps" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(3,1fr)">
<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--surface-1);padding:14px 12px"><span class="tok">--border-subtle</span><span class="hex">#eceae5 — dividers, card footers</span></div>
<div style="border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-1);padding:14px 12px"><span class="tok">--border-default</span><span class="hex">#e0ddd6 — cards, inputs, buttons</span></div>
<div style="border:1px solid var(--border-strong);border-radius:var(--radius-lg);background:var(--surface-1);padding:14px 12px"><span class="tok">--border-strong</span><span class="hex">#cdc9c0 — hover, scrollbars</span></div>
</div>
</body></html>
