<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="12–16px core; pills for badges" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>
.rgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.rbox{height:56px;background:var(--surface-1);border:1px solid var(--border-default)}
</style></head>
<body>
<div class="rgrid">
<div><div class="rbox" style="border-radius:var(--radius-xs)"></div><span class="tok">xs 6</span></div>
<div><div class="rbox" style="border-radius:var(--radius-sm)"></div><span class="tok">sm 8</span></div>
<div><div class="rbox" style="border-radius:var(--radius-md)"></div><span class="tok">md 10</span></div>
<div><div class="rbox" style="border-radius:var(--radius-lg)"></div><span class="tok">lg 12 · controls</span></div>
<div><div class="rbox" style="border-radius:var(--radius-xl)"></div><span class="tok">xl 16 · cards</span></div>
<div><div class="rbox" style="border-radius:var(--radius-2xl)"></div><span class="tok">2xl 20</span></div>
<div><div class="rbox" style="border-radius:var(--radius-pill)"></div><span class="tok">pill · badges</span></div>
</div>
</body></html>
