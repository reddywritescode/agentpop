<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Warm, restrained elevation" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;text-align:center;padding:6px 4px 10px}
.sbox{height:64px;background:var(--surface-1);border-radius:var(--radius-lg)}
</style></head>
<body>
<div class="sgrid">
<div><div class="sbox" style="box-shadow:var(--shadow-xs)"></div><span class="tok">xs · cards, buttons</span></div>
<div><div class="sbox" style="box-shadow:var(--shadow-sm)"></div><span class="tok">sm</span></div>
<div><div class="sbox" style="box-shadow:var(--shadow-md)"></div><span class="tok">md · popovers</span></div>
<div><div class="sbox" style="box-shadow:var(--shadow-lg)"></div><span class="tok">lg · sheets</span></div>
<div><div class="sbox" style="box-shadow:var(--shadow-overlay)"></div><span class="tok">overlay · dialogs</span></div>
</div>
</body></html>
