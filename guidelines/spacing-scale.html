<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="8px rhythm, 4px half-steps" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>
.srow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.srow .tok{width:110px}
.bar{height:16px;background:var(--accent-subtle-bg);border:1px solid var(--accent-subtle-border);border-radius:3px}
</style></head>
<body>
<div class="srow"><span class="tok">--space-1 · 4px</span><div class="bar" style="width:4px"></div></div>
<div class="srow"><span class="tok">--space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
<div class="srow"><span class="tok">--space-3 · 12px</span><div class="bar" style="width:12px"></div></div>
<div class="srow"><span class="tok">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="srow"><span class="tok">--space-5 · 20px</span><div class="bar" style="width:20px"></div></div>
<div class="srow"><span class="tok">--space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="srow"><span class="tok">--space-8 · 32px</span><div class="bar" style="width:32px"></div></div>
<div class="srow"><span class="tok">--space-10 · 40px</span><div class="bar" style="width:40px"></div></div>
<div class="srow" style="margin-bottom:0"><span class="tok">--space-12 · 48px</span><div class="bar" style="width:48px"></div></div>
</body></html>
