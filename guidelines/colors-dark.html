<!-- @dsCard group="Colors" viewport="700x170" name="Dark mode" subtitle="Same tokens re-derived under .dark" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head>
<body class="dark" style="background:var(--surface-canvas)">
<div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--surface-canvas)"></div><div class="meta"><span class="tok">--surface-canvas</span><span class="hex">#17161a</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><span class="tok">--surface-1</span><span class="hex">#201f24</span></div></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><span class="tok">--accent</span><span class="hex">#6366f1</span></div></div>
<div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;background:var(--surface-1)"><span style="color:var(--text-primary);font-size:13px">Aa text</span></div><div class="meta"><span class="tok">--text-primary</span><span class="hex">#f5f3ef</span></div></div>
<div class="sw"><div class="chip" style="display:flex;align-items:center;justify-content:center;background:var(--surface-1)"><span style="background:var(--success-bg);color:var(--success-fg);border:1px solid var(--success-border);border-radius:var(--radius-pill);font-size:11px;font-weight:500;padding:2px 8px">Running</span></div><div class="meta"><span class="tok">--success-*</span><span class="hex">re-derived</span></div></div>
</div>
</body></html>
