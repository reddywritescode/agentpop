<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces" subtitle="Warm off-white canvas, layered upward" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--surface-canvas)"></div><div class="meta"><span class="tok">--surface-canvas</span><span class="hex">#faf9f7</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><span class="tok">--surface-1</span><span class="hex">#ffffff</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><span class="tok">--surface-2</span><span class="hex">#f5f3f0</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="meta"><span class="tok">--surface-3</span><span class="hex">#efece7</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-inset)"></div><div class="meta"><span class="tok">--surface-inset</span><span class="hex">#f2f0ec</span></div></div>
</div>
</body></html>
