<!-- @dsCard group="Colors" viewport="700x150" name="Text" subtitle="Warm near-black ink ramp" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div style="padding:12px 12px 8px;font-size:15px;font-weight:600;color:var(--text-primary)">Sandbox created</div><div class="meta"><span class="tok">--text-primary</span><span class="hex">#1a1a18</span></div></div>
<div class="sw"><div style="padding:12px 12px 8px;font-size:13px;color:var(--text-secondary)">Configure a new sandbox.</div><div class="meta"><span class="tok">--text-secondary</span><span class="hex">#57544e</span></div></div>
<div class="sw"><div style="padding:12px 12px 8px;font-size:13px;color:var(--text-tertiary)">Max 22 chars.</div><div class="meta"><span class="tok">--text-tertiary</span><span class="hex">#8a867e</span></div></div>
<div class="sw"><div style="padding:12px 12px 8px;font-size:13px;color:var(--text-disabled)">Unavailable</div><div class="meta"><span class="tok">--text-disabled</span><span class="hex">#b7b3aa</span></div></div>
</div>
</body></html>
