<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="Cobalt indigo — the only brand color" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><span class="tok">--accent</span><span class="hex">#4f46e5</span></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-hover)"></div><div class="meta"><span class="tok">--accent-hover</span><span class="hex">#4338ca</span></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-active)"></div><div class="meta"><span class="tok">--accent-active</span><span class="hex">#3730a3</span></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-subtle-bg);display:flex;align-items:center;justify-content:center"><span style="color:var(--accent-subtle-text);font-size:12px;font-weight:500">Selected</span></div><div class="meta"><span class="tok">--accent-subtle-*</span><span class="hex">#eef0fd / #3730a3</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-1);display:flex;align-items:center;justify-content:center"><a href="#" style="font-size:13px">View docs</a></div><div class="meta"><span class="tok">--accent-text</span><span class="hex">#4338ca (AA links)</span></div></div>
</div>
</body></html>
