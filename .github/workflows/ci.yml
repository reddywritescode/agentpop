name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Go services and SDK
        run: go test ./...

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Build web, UI, connector broker, and SDK
        run: pnpm build
