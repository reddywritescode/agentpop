server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  expires -1;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /openapi.yaml {
    default_type application/yaml;
    try_files $uri =404;
  }

  location ~ ^/(signin|signup|app|admin)(/|$) {
    # Cloud Run terminates TLS before nginx. A relative return is expanded with
    # nginx's internal http:8080 listener; always use the public HTTPS origin.
    return 302 https://agentpop.cloud/hosted-unavailable;
  }

  location ~ ^/(terms|privacy|status|hosted-unavailable)/?$ {
    try_files /index.html =404;
  }

  # API, health, private, preview, and unknown paths have no SPA fallback.
  location / {
    try_files $uri $uri/ =404;
  }
}

# Retired hosted consoles must not imply that the backend has been restored.
server {
  listen 8080;
  server_name app.agentpop.cloud admin.agentpop.cloud;
  server_tokens off;

  location ~ ^/(v1|private|preview|healthz)(/|$) {
    return 404;
  }

  location / {
    return 302 https://agentpop.cloud/hosted-unavailable;
  }
}
