[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentpop"
version = "0.1.0"
description = "Python SDK for AgentPop sandboxes and cloud agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentPop contributors" }]
dependencies = []

[project.urls]
Homepage = "https://agentpop.cloud"
Documentation = "https://agentpop.cloud/docs"
Repository = "https://github.com/reddywritescode/agentpop"
Issues = "https://github.com/reddywritescode/agentpop/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentpop"]
