name: agentpop

services:
  sandbox-image:
    image: agentpop/devbox:local
    build:
      context: ./images/devbox
    entrypoint: ["/bin/true"]
    restart: "no"

  host-agent:
    build:
      context: .
      dockerfile: deploy/docker/host-agent.Dockerfile
    environment:
      RUNTIME_DRIVER: docker
      HOST_AGENT_ADDR: 0.0.0.0:9090
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN:-agentpop-local-host-token}
      HOST_STATE_DIR: /var/lib/agentpop/host-agent
      HOST_ID: local-docker
      HOST_NAME: Local Docker data plane
      HOST_REGION: local
      DOCKER_SANDBOX_IMAGE: agentpop/devbox:local
      SANDBOX_SSH_KEY: /var/lib/agentpop/ssh/id_ed25519
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.local/compose/host-agent:/var/lib/agentpop/host-agent
      - ./.local/compose/ssh:/var/lib/agentpop/ssh
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  connector-broker:
    build:
      context: .
      dockerfile: deploy/docker/connector-broker.Dockerfile
    environment:
      CONNECTOR_BROKER_ADDR: 0.0.0.0:7070
      CONNECTOR_BROKER_STATE: /var/lib/agentpop/connector-broker/state.json
      CONNECTOR_BROKER_TOKEN: ${CONNECTOR_BROKER_TOKEN:-agentpop-local-connector-broker-token}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    volumes:
      - ./.local/compose/connector-broker:/var/lib/agentpop/connector-broker
    restart: unless-stopped

  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
    environment:
      CONTROL_PLANE_ADDR: 0.0.0.0:8080
      CONTROL_PLANE_MODE: local
      CONTROL_PLANE_STATE: /var/lib/agentpop/control-plane/state.json
      HOST_AGENT_URL: http://host-agent:9090
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN:-agentpop-local-host-token}
      CONTROL_PLANE_ENCRYPTION_KEY: ${CONTROL_PLANE_ENCRYPTION_KEY:-agentpop-local-encryption-key}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-agentpop-local-api-token}
      ALLOW_INSECURE_LOCAL_AUTH: "1"
      PUBLIC_API_URL: http://127.0.0.1:8088
      PUBLIC_WEB_URL: http://127.0.0.1:8088
      PUBLIC_PREVIEW_BASE_URL: http://127.0.0.1:8088
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      CONNECTOR_BROKER_URL: http://connector-broker:7070
      CONNECTOR_BROKER_TOKEN: ${CONNECTOR_BROKER_TOKEN:-agentpop-local-connector-broker-token}
    volumes:
      - ./.local/compose/control-plane:/var/lib/agentpop/control-plane
    depends_on:
      - host-agent
      - connector-broker
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_URL: /
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - control-plane
    restart: unless-stopped
